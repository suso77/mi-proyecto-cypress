name: A11y Evidence (con capturas)

on:
  workflow_dispatch:
  workflow_run:
    workflows: [ "A11y CI (WCAG 2.1/2.2)" ]
    types: [ completed ]

permissions:
  contents: read

jobs:
  evidence:
    name: "Evidence – ${{ matrix.target }}"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: staging
          - target: prod

    concurrency:
      group: a11y-evidence-${{ github.ref }}-${{ matrix.target }}
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps (ci)
        run: npm ci

      - name: Resolve target env (evidence)
        id: res
        shell: bash
        env:
          SITE_URL_PROD:            ${{ secrets.SITE_URL_PROD }}
          PUBLIC_BASE_URL_PROD:     ${{ secrets.PUBLIC_BASE_URL_PROD }}
          SITE_URL_STAGING:         ${{ secrets.SITE_URL_STAGING }}
          PUBLIC_BASE_URL_STAGING:  ${{ secrets.PUBLIC_BASE_URL_STAGING }}
          BASIC_AUTH_USER:          ${{ secrets.BASIC_AUTH_USER }}
          BASIC_AUTH_PASS:          ${{ secrets.BASIC_AUTH_PASS }}
        run: |
          if [ "${{ matrix.target }}" = "prod" ]; then
            SITE_URL="$SITE_URL_PROD"
            PUBLIC_BASE_URL="$PUBLIC_BASE_URL_PROD"
          else
            SITE_URL="$SITE_URL_STAGING"
            PUBLIC_BASE_URL="$PUBLIC_BASE_URL_STAGING"
          fi

          echo "SITE_URL=$SITE_URL" >> "$GITHUB_OUTPUT"
          echo "PUBLIC_BASE_URL=$PUBLIC_BASE_URL" >> "$GITHUB_OUTPUT"
          echo "BASIC_AUTH_USER=$BASIC_AUTH_USER" >> "$GITHUB_OUTPUT"
          echo "BASIC_AUTH_PASS=$BASIC_AUTH_PASS" >> "$GITHUB_OUTPUT"

          TODAY="$(date +'%d-%m-%Y')"
          HOST="$(python3 -c "import sys, urllib.parse as u; print(u.urlparse(sys.argv[1]).netloc.replace(':','-'))" "$PUBLIC_BASE_URL")"
          echo "REPORT_FOLDER=auditorias/${TODAY}-${HOST}" >> "$GITHUB_OUTPUT"

      - name: Run Cypress – evidence mode
        run: npm run auditoria:full
        env:
          SITE_URL:        ${{ steps.res.outputs.SITE_URL }}
          PUBLIC_BASE_URL: ${{ steps.res.outputs.PUBLIC_BASE_URL }}
          BASIC_AUTH_USER: ${{ steps.res.outputs.BASIC_AUTH_USER }}
          BASIC_AUTH_PASS: ${{ steps.res.outputs.BASIC_AUTH_PASS }}
          CSV_MODE: tsv
          LINK_MODE: plain
          CYPRESS_A11Y_RUNALL: "1"

      - name: Post-procesado informe
        run: npm run postprocess:informe
        env:
          SITE_URL:        ${{ steps.res.outputs.SITE_URL }}
          PUBLIC_BASE_URL: ${{ steps.res.outputs.PUBLIC_BASE_URL }}

      - name: Upload report artifacts (evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-evidence-${{ matrix.target }}
          path: ${{ steps.res.outputs.REPORT_FOLDER }}
          if-no-files-found: warn
          retention-days: 14

