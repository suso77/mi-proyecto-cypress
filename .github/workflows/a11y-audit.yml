name: a11y

on:
  workflow_dispatch:
  push:
    branches: [ main, master, principal ]
  pull_request:

jobs:
  a11y:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://www.hiexperience.es
      LC_ALL: C.UTF-8
      LANG: C.UTF-8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # La action hará: npm ci, instalar Cypress y ejecutar tu comando
      - name: Cypress run (usa tu script)
        uses: cypress-io/github-action@v6
        with:
          install-command: npm ci
          command: npm run test:evidencias
          # Si quieres limitar URLs:
          # env: A11Y_MAX_URLS=100

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-artifacts
          path: |
            cypress/videos/**
            cypress/screenshots/**
            auditorias/**/*
          retention-days: 7
