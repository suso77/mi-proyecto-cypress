name: a11y

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://www.hiexperience.es
      PUBLIC_BASE_URL: https://www.hiexperience.es
      CYPRESS_CACHE_FOLDER: ~/.cache/Cypress
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps (npm ci)
        run: npm ci

      - name: Install Cypress binary
        run: npx cypress install

      - name: Verify Cypress
        run: npx cypress verify

      - name: Limpiar informe anterior
        run: npm run auditoria:clean

      - name: Ejecutar auditoría
        run: npm run auditoria

      - name: Subir artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditorias
          path: |
            auditorias/**
            cypress/screenshots/**
            cypress/videos/**
          if-no-files-found: ignore
          retention-days: 7

