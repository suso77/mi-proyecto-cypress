name: a11y

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "URL base del sitio a auditar (por defecto: https://www.hiexperience.es)"
        required: false
        default: "https://www.hiexperience.es"
  push:
    branches: [ main, master, principal ]
  pull_request:

jobs:
  a11y:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ github.event.inputs.site_url || 'https://www.hiexperience.es' }}
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
      CRITICAL_MAX: 0
      SERIOUS_MAX: 5

    steps:
      # 1️⃣ Clona el repo
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # 2️⃣ Configura Node
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3️⃣ Instala dependencias
      - name: Instalar dependencias
        run: npm ci

      # 4️⃣ Rastrea todas las URLs internas del sitio
      - name: Rastreo de URLs (crawler)
        run: |
          echo "🌐 Rastreando sitio: $SITE_URL"
          npm run crawl
          echo "✅ Archivo generado: scripts/urls.json"
        env:
          SITE_URL: ${{ env.SITE_URL }}

      # 5️⃣ Ejecuta la auditoría de accesibilidad con Cypress + axe-core
      - name: Ejecutar auditoría de accesibilidad
        uses: cypress-io/github-action@v6
        with:
          install-command: npm ci
          command: npm run auditoria || echo "Violaciones detectadas, continuamos..."
        env:
          SITE_URL: ${{ env.SITE_URL }}

      # 6️⃣ Genera el informe Excel
      - name: Generar informe Excel (export-to-xlsx)
        run: |
          echo "📊 Generando informe de accesibilidad..."
          npm run export
          echo "✅ Informe generado correctamente."
        continue-on-error: true

      # 7️⃣ Control de calidad (Quality Gate)
      - name: Control de calidad (Quality Gate)
        run: node scripts/quality-gate.js
        continue-on-error: false

      # 8️⃣ Publica artefactos
      - name: Upload artifacts (capturas, informes, resultados)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-a11y-${{ github.run_number }}
          path: |
            cypress/screenshots/**
            cypress/videos/**
            auditorias/**/*
          retention-days: 14

      # 9️⃣ Resumen final
      - name: Resumen de ejecución
        if: always()
        run: |
          echo "✅ Auditoría completada."
          echo "🌍 Sitio auditado: $SITE_URL"
          echo "📊 Informe generado y disponible en artefactos."
          echo "🚦 Umbrales de control → Critical <= $CRITICAL_MAX, Serious <= $SERIOUS_MAX"
