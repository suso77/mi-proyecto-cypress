name: Auditoría A11Y (Cypress + axe-core)

on:
  workflow_dispatch:
  push:
    branches: [ main, master, principal ]
  pull_request:

jobs:
  a11y:
    runs-on: ubuntu-latest
    env:
      # Evita el warning de locale en logs
      LC_ALL: C.UTF-8
      LANG: C.UTF-8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (npm ci)
        run: npm ci

      # Asegura binarios de Cypress (usa caché si puede)
      - name: Cypress install
        uses: cypress-io/github-action@v6
        with:
          runTests: false

      # === Elige qué script quieres correr ===
      # Opción 1: tu suite principal por sitemap (recomendada)
      - name: Run audit (test:evidencias)
        run: npm run test:evidencias

      # Opción 2: el "clean" (si quieres ese flujo):
      # - name: Run audit (auditoria:clean)
      #   run: npm run auditoria:clean

      # Sube artefactos de Cypress (vídeos/screenshots)
      - name: Upload Cypress artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            cypress/videos/**
            cypress/screenshots/**
          retention-days: 7

      # Sube informes/CSV/TSV/HTML si tus scripts los generan
      - name: Upload audit outputs (reports)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-reports
          path: |
            **/*.csv
            **/*.tsv
            **/*informe*.html
            **/auditoria*/**/*.html
            **/auditoria*/**/*.csv
            **/auditoria*/**/*.tsv
          retention-days: 7
