name: a11y

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://www.hiexperience.es
      PUBLIC_BASE_URL: https://www.hiexperience.es
      CYPRESS_CACHE_FOLDER: ~/.cache/Cypress
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Run Cypress (Chrome)
        uses: cypress-io/github-action@v6
        with:
          install: false
          runTests: true
          command: npm run auditoria:chrome
          browser: chrome

      - name: Subir artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditorias
          path: |
            auditorias/**
            cypress/screenshots/**
            cypress/videos/**
          if-no-files-found: ignore
          retention-days: 7

