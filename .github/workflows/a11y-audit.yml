name: Auditoría de Accesibilidad (Cypress + axe-core)

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "Dominio o URL principal a auditar (ej: https://www.hiexperience.es)"
        required: true
        default: "https://www.hiexperience.es"

jobs:
  a11y-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # 1️⃣ Clona el repositorio
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # 2️⃣ Configura Node.js
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3️⃣ Instala dependencias
      - name: Instalar dependencias
        run: npm ci

      # 4️⃣ Ejecuta crawler (rastrea todas las URLs internas)
      - name: Rastreo de URLs
        run: |
          SITE_URL=${{ github.event.inputs.site_url }} npm run crawl
        env:
          SITE_URL: ${{ github.event.inputs.site_url }}

      # 5️⃣ Ejecuta auditoría con Cypress + axe-core
      - name: Auditoría de accesibilidad
        run: |
          SITE_URL=${{ github.event.inputs.site_url }} npm run auditoria
        env:
          SITE_URL: ${{ github.event.inputs.site_url }}

      # 6️⃣ Genera informe Excel
      - name: Generar informe Excel
        run: npm run export

      # 7️⃣ Publica artefactos (resultados + capturas + informe)
      - name: Subir artefactos de auditoría
        uses: actions/upload-artifact@v4
        with:
          name: auditoria-a11y-${{ github.run_number }}
          path: |
            auditorias/**
          retention-days: 30

      # 8️⃣ Publica resumen rápido en la consola
      - name: Resumen de ejecución
        run: |
          echo "✅ Auditoría completada."
          echo "📊 Informe y capturas disponibles como artefactos."
          echo "🌐 Sitio auditado: ${{ github.event.inputs.site_url }}"
          echo "🏁 Ejecución nº ${{ github.run_number }}"
