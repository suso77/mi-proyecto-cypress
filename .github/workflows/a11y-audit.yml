name: a11y

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  a11y:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://www.hiexperience.es
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
      CYPRESS_CACHE_FOLDER: ~/.cache/Cypress

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Install Cypress binary
        run: npx cypress install

      - name: Verify Cypress
        run: npx cypress verify

      - name: Limpiar informe anterior
        run: npm run auditoria:clean

      - name: Ejecutar auditoría
        run: npm run auditoria

      - name: Subir artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditorias
          path: auditorias/
          retention-days: 14
