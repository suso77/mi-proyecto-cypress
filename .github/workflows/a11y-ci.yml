name: A11y CI (Cypress headless)

on:
  push:
    branches: [ main, artifacts ]
  pull_request:

jobs:
  a11y:
    runs-on: ubuntu-latest
    env:
      BASE_URL: "https://www.hiexperience.es"
      CYPRESS_CACHE_FOLDER: ~/.cache/Cypress
      CSV_MODE: "sheets"
      LINK_MODE: "plain"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (cache npm)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Verify Cypress
        run: npx cypress verify

      # ----- Ejecuta tus pruebas -----
      # Opción 1: sólo smoke (rápido)
      - name: Run Cypress (smoke only, electron)
        run: npm run test:a11y:flujos
        env:
          CYPRESS_baseUrl: ${{ env.BASE_URL }}

      # Opción 2 (si quieres auditoría completa en el CI): descomenta
      # - name: Run Full Audit (sitemap + flujos)
      #   run: npm run auditoria:sheets:plain

      # ---- Construir nombre de carpeta auditoría: DD-MM-YYYY-<host> ----
      - name: Compute audit dir
        run: |
          DATE="$(TZ=Europe/Madrid date +'%d-%m-%Y')"     # ajusta TZ si prefieres UTC
          SITE="$(node -e "console.log(new URL(process.env.BASE_URL).hostname.replace(/^www\./,''))")"
          echo "AUDIT_DIR_NAME=${DATE}-${SITE}" >> "$GITHUB_ENV"
          echo "📁 auditorias/${DATE}-${SITE}"

      # ---- Normalizar carpeta si Cypress la creó como *-sitio-desconocido ----
      - name: Normalize audit folder (optional)
        run: |
          set -eux
          mkdir -p "auditorias/${AUDIT_DIR_NAME}"
          UNKNOWN="$(ls -d auditorias/*-sitio-desconocido 2>/dev/null || true)"
          if [ -n "$UNKNOWN" ]; then
            echo "🔁 Renombrando $UNKNOWN -> auditorias/${AUDIT_DIR_NAME}"
            shopt -s dotglob nullglob
            mv "$UNKNOWN"/* "auditorias/${AUDIT_DIR_NAME}/" || true
            rmdir "$UNKNOWN" || true
          fi
          # Archivos mínimos útiles
          if [ ! -f "auditorias/${AUDIT_DIR_NAME}/README.txt" ]; then
            cat > "auditorias/${AUDIT_DIR_NAME}/README.txt" <<TXT
Auditoría A11y
- Fecha: ${AUDIT_DIR_NAME%%-*}
- Sitio: ${AUDIT_DIR_NAME#*-}
- Base URL: ${BASE_URL}
Generado por CI.
TXT
          fi

      # ---- Subir el paquete completo de auditoría ----
      - name: Upload A11y bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditorias-${{ env.AUDIT_DIR_NAME }}
          path: |
            auditorias/${{ env.AUDIT_DIR_NAME }}/**
          retention-days: 30
          if-no-files-found: error

      # ---- Subir ficheros deduplicados (CSV/TSV) si existen ----
      - name: Upload deduped reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-dedup-${{ env.AUDIT_DIR_NAME }}
          path: |
            auditorias/${{ env.AUDIT_DIR_NAME }}/**/*dedup*.csv
            auditorias/${{ env.AUDIT_DIR_NAME }}/**/*dedup*.tsv
            auditorias/${{ env.AUDIT_DIR_NAME }}/**/*-resumen*.csv
            auditorias/${{ env.AUDIT_DIR_NAME }}/**/*-resumen*.tsv
          retention-days: 30
          if-no-files-found: ignore

      # ---- (Opcional) legacy cypress folders por compatibilidad ----
      - name: Upload legacy Cypress folders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-legacy
          path: |
            cypress/screenshots/**
            cypress/videos/**
          retention-days: 7
          if-no-files-found: ignore

      # ---- Comentar en el PR con enlace a artifacts ----
      - name: Comment on PR with summary and artifacts link
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const auditName = `auditorias-${process.env.AUDIT_DIR_NAME}`;
            const dedupName = `a11y-dedup-${process.env.AUDIT_DIR_NAME}`;
            const lines = [];
            lines.push(`### ♿ A11y CI – Evidencias`);
            lines.push(`**Base URL:** ${process.env.BASE_URL}`);
            lines.push(`**Carpeta:** \`auditorias/${process.env.AUDIT_DIR_NAME}\``);
            lines.push('');
            lines.push(`- 📦 Artifact principal: **${auditName}**`);
            lines.push(`- 🧹 Artifact deduplicado: **${dedupName}** (si existe)`);
            lines.push(`- 🔗 Ver artifacts del run: [Actions → artifacts](${runUrl})`);
            lines.push('');
            lines.push(`> El informe usa \`LINK_MODE=plain\` para URLs en texto plano.`);
            const body = lines.join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body
            });
