name: a11y

on:
  workflow_dispatch:
  push:
    branches: [ main, master, principal ]
  pull_request:

jobs:
  a11y:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://www.hiexperience.es
      LC_ALL: C.UTF-8
      LANG: C.UTF-8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cypress install
        uses: cypress-io/github-action@v6
        with:
          runTests: false

      # Usa tu suite principal (o cambia a auditoria:clean si quieres)
      - name: Run audit
        run: npm run test:evidencias

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-artifacts
          path: |
            cypress/videos/**
            cypress/screenshots/**
            auditorias/**/*
          retention-days: 7

