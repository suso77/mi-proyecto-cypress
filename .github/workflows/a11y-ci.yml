name: A11y CI (Cypress headless)

on:
  push:
    branches: [ main, artifacts ]
  pull_request:

jobs:
  a11y:
    runs-on: ubuntu-latest
    env:
      BASE_URL: "https://www.hiexperience.es"
      CYPRESS_CACHE_FOLDER: ~/.cache/Cypress

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (cache npm)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Verify Cypress
        run: npx cypress verify

      - name: Run Cypress (smoke only, electron)
        run: npm run test:a11y:smoke
        env:
          CYPRESS_baseUrl: ${{ env.BASE_URL }}

      - name: Upload Cypress artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            cypress/screenshots
            cypress/videos
          retention-days: 7
