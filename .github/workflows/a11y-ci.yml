name: a11y

on:
  workflow_dispatch:
  push:
    branches: [ main, master, principal ]
  pull_request:

jobs:
  a11y:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://www.hiexperience.es
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
      # guarda la caché de binarios de Cypress en el workspace (evita permisos raros)
      CYPRESS_CACHE_FOLDER: ~/.cache/Cypress

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Asegura devDependencies
      - name: Install dependencies (dev)
        run: npm ci --include=dev
        env:
          NODE_ENV: development

      # Instala y verifica el binario de Cypress de forma explícita
      - name: Install Cypress binary
        run: npx cypress install

      - name: Verify Cypress binary
        run: |
          npx cypress --version
          echo "node_modules/.bin contents:"
          ls -la node_modules/.bin | sed -n '1,120p'

      # Ejecuta tu suite
      - name: Run audit (test:evidencias)
        run: npm run test:evidencias

      # Artefactos (vídeos/screenshots + informes)
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-artifacts
          path: |
            cypress/videos/**
            cypress/screenshots/**
            auditorias/**/*
          retention-days: 7
