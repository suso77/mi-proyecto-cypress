name: A11y CI (Cypress headless)

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  a11y:
    runs-on: ubuntu-latest
    env:
      # Ajusta si tu app arranca en otro puerto:
      BASE_URL: "http://localhost:5173" # vite preview
      # Si usas Next:
      # BASE_URL: "http://localhost:3000"
      # Si sirves /dist con http-server:
      # BASE_URL: "http://localhost:8080"
      CYPRESS_CACHE_FOLDER: ~/.cache/Cypress

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Build app (si aplica)
        run: npm run build --if-present

      - name: Start app (si aplica)
        run: npm run start --if-present &

      - name: Esperar a que responda la app
        run: npx wait-on $BASE_URL

      - name: Verificar Cypress (opcional)
        run: npx cypress verify

      - name: Ejecutar Cypress (headless)
        run: npm run test:a11y
        env:
          CYPRESS_baseUrl: ${{ env.BASE_URL }}

      # Publicación de artefactos completos la haremos en la siguiente tarea
      # - name: Subir screenshots/videos (opcional ahora)
      #   if: always()
