name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Use exact npm
        run: npm i -g npm@11.6.2

      - name: Install (npm ci)
        run: npm ci

      - name: Audit (no bloquear por low)
        run: npm audit --audit-level=moderate || true

      - name: Lint
        run: npm run lint || true

      - name: Test
        run: npm test

      - name: Build
        run: npm run build





